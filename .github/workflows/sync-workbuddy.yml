name: Sync workbuddy scripts

on:
  schedule:
    # 每天凌晨 3 点同步（北京时间 Asia/Shanghai；GitHub cron 只认 UTC，即每天 19:00 UTC）
    - cron: '0 19 * * *'
  workflow_dispatch:   # 允许在 Actions 页面手动触发同步
  push:
    paths:
      - '.github/workflows/sync-workbuddy.yml'

# 允许写入仓库内容（提交并推送同步结果）
permissions:
  contents: write

concurrency:
  group: sync-workbuddy
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPO: L0NE-6/WorkBuddy-Daily   # 上游源仓库
      UPSTREAM_BRANCH: main                    # 上游分支
      # 需要同步的文件，每行一个（相对上游仓库根目录）
      TARGET_FILES: |
        workbuddy_daily.py
        workbuddy_login.py
        workbuddy_intl_daily.py
        workbuddy_intl_login.py
        requirements.txt
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync files from upstream
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=0
          while IFS= read -r raw || [ -n "$raw" ]; do
            f="${raw%$'\r'}"                    # 去掉可能的 CR
            f="$(echo "$f" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
            [ -z "$f" ] && continue
            url="https://raw.githubusercontent.com/${UPSTREAM_REPO}/${UPSTREAM_BRANCH}/${f}"
            echo "正在下载: ${url}"
            tmp="$(mktemp)"
            if ! curl -fsSL --retry 3 "$url" -o "$tmp"; then
              echo "::error::下载失败: $f"; rm -f "$tmp"; exit 1
            fi
            if [ ! -s "$tmp" ]; then
              echo "::error::下载到的文件为空，终止同步: $f"; rm -f "$tmp"; exit 1
            fi
            mkdir -p "$(dirname "$f")"
            if [ -f "$f" ] && cmp -s "$tmp" "$f"; then
              echo "$f 已是最新，无需更新"
            else
              cp "$tmp" "$f"
              git add "$f"
              changed=1
              echo "已更新 $f"
            fi
            rm -f "$tmp"
          done <<< "$TARGET_FILES"
          if [ "$changed" -eq 1 ]; then
            git commit -m "chore: 从 ${UPSTREAM_REPO} 同步 workbuddy 脚本"
            git push
            echo "已推送本次同步"
          else
            echo "所有文件均为最新，无需提交"
          fi